<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portal de Educación y Cultura">
  <title>Acceso · Educación y Cultura</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="login">
  <main class="login__caja">
    <div class="login__marca">
      <span class="login__logo" aria-hidden="true">✦</span>
      <h1>Educación y Cultura</h1>
      <p>Directorio de instituciones y espacios de aprendizaje</p>
    </div>
    <div id="mensaje" class="alerta alerta--error oculto" role="alert"></div>
    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input class="campo__control" type="email" id="email" name="email" autocomplete="username"
          placeholder="gestor@educulturademo.test" aria-describedby="errorEmail" required>
        <p class="campo__error" id="errorEmail"></p>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input class="campo__control" type="password" id="password" name="password"
          autocomplete="current-password" placeholder="••••••••"
          aria-describedby="errorPassword" required>
        <p class="campo__error" id="errorPassword"></p>
      </div>
      <div class="campo">
        <label class="login__mostrar"><input type="checkbox" id="verPassword"> Mostrar contraseña</label>
      </div>
      <button class="btn btn--primario btn--bloque" type="submit" id="btnEntrar">Ingresar</button>
    </form>
    <p class="login__pista">
      <strong>Acceso de demostración</strong><br>
      <code>admin@educulturademo.test</code> / <code>Admin123!</code><br>
      <code>gestor@educulturademo.test</code> / <code>Gestor123!</code>
    </p>
  </main>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
